name: Refresh AI tool directory

on:
  schedule:
    # Every day at 04:15 UTC (12:15 PM in Manila)
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: directory-refresh
  cancel-in-progress: false

jobs:
  discover-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out directory
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Discover, categorize, and publish qualified tools
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          ADSENSE_PUBLISHER_ID: ${{ secrets.ADSENSE_PUBLISHER_ID }}
          ADSENSE_HOME_SLOT: ${{ secrets.ADSENSE_HOME_SLOT }}
          ADSENSE_LISTING_SLOT: ${{ secrets.ADSENSE_LISTING_SLOT }}
          ADSENSE_DETAIL_SLOT: ${{ secrets.ADSENSE_DETAIL_SLOT }}
        run: python scripts/update-directory.py

      - name: Validate generated JavaScript
        run: |
          node --check assets/data.js
          node --check assets/auto-data.js
          node --check assets/app.js

      - name: Commit directory updates
        run: |
          if git diff --quiet; then
            echo "No qualified new tools found."
            exit 0
          fi
          git config user.name "Novera Directory Bot"
          git config user.email "directory-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh discovered AI tools"
          git push
